<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="./assets/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkbox.css">
    <title>camp.in</title>
</head>

<body>
    <div class="parent">
        <div class="div1">
            <header>
                <div>
                    <img src="./assets/logo.svg" alt="">
                </div>

            </header>

            <main>

                <div class="titulos">
                    <div>
                        <h1><img src="./assets/log-in.svg">Faça seu login</h1>
                        <h2>Entre com suas informações de cadastro.</h2>
                    </div>

                </div>



                <section class="loginSection">
                    <label for="emailInput">E-mail</label>
                    <input type="text" id="emailInput" placeholder="Digite seu e-mail">

                    <label for="senhaInput">Senha</label>
                    <input type="password" id="senhaInput" placeholder="Digite sua senha">

                </section>

                <section class="loginSectionTwo">
                    <div>
                        <label class="container">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            <p>Lembre-me</p>
                    </div>

                    <p id="pp">Esqueci minha senha</span>
                </section>


                <button class="buttonLogin">
                    ENTRAR
                </button>

                <h3>Não tem uma conta? <p>Registre-se</p>
                </h3>


            </main>
        </div>

        <div class="div2"> 
           
        </div>


    </div>
</body>

</html>
